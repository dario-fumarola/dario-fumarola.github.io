<div class="portrait-gallery" role="region" aria-roledescription="carousel" aria-label="Photos of Dario Fumarola">
  <div class="portrait-frame">
    <img class="portrait-slide slide-main active" src="{{ "/assets/photos/portrait.jpeg" | relative_url }}" alt="Dario Fumarola by a wooden staircase" width="1200" height="801" fetchpriority="high" aria-hidden="false">
    <img class="portrait-slide slide-devcon" src="{{ "/assets/photos/devcon.jpeg" | relative_url }}" alt="Dario Fumarola speaking at DevCon" width="1200" height="904" loading="lazy" decoding="async" aria-hidden="true">
    <img class="portrait-slide" src="{{ "/assets/icml-pic.jpeg" | relative_url }}" alt="Dario Fumarola presenting at ICML 2025" loading="lazy" decoding="async" aria-hidden="true">
    <img class="portrait-slide" src="{{ "/assets/neurips.jpeg" | relative_url }}" alt="Dario Fumarola at NeurIPS 2025" loading="lazy" decoding="async" aria-hidden="true">
    <img class="portrait-slide slide-nyrl" src="{{ "/assets/nyrl.jpeg" | relative_url }}" alt="Dario Fumarola at the NY-RL workshop" loading="lazy" decoding="async" aria-hidden="true">
    <img class="portrait-slide slide-laptop" src="{{ site.logo | relative_url }}" alt="Dario Fumarola working at his laptop" loading="lazy" decoding="async" aria-hidden="true">
    <img class="portrait-slide" src="{{ "/assets/photo-5.jpeg" | relative_url }}" alt="Dario Fumarola beneath the northern lights" loading="lazy" decoding="async" aria-hidden="true">
  </div>
  <div class="portrait-controls" hidden>
    <button type="button" class="photo-previous" aria-label="Previous photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
    <span class="photo-count" aria-live="off">1 / 7</span>
    <button type="button" class="photo-next" aria-label="Next photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button>

  </div>
</div>
