<figure class="mood-junction" data-setting="seeking">
  <p class="mood-figure-title">At the same junction</p>
  <div class="mood-settings" role="group" aria-label="Policy setting at this junction" hidden>
    <button type="button" data-setting="seeking" aria-pressed="true">Seeking <span><var>w</var> = 0.2</span></button>
    <button type="button" data-setting="cautious" aria-pressed="false">Cautious <span><var>w</var> = 0.7</span></button>
  </div>
  <svg class="mood-map" viewBox="0 0 320 244" role="img" aria-labelledby="mood-map-title mood-map-description">
    <title id="mood-map-title">Two candidate routes to a pellet</title>
    <desc id="mood-map-description">The junction from Figure 3. The agent starts below a central wall. A short route goes east near an active ghost; a longer detour goes west. The highlighted route indicates the preferred first action at the selected cost weight.</desc>
    <defs>
      <pattern id="mood-grid" width="32" height="32" patternUnits="userSpaceOnUse" x="16" y="32"><path d="M32 0H0V32" fill="none" class="mood-grid-line"/></pattern>
      <marker id="mood-route-head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="m0 0 8 4-8 4Z" fill="context-stroke"/></marker>
    </defs>
    <rect class="mood-map-floor" x="16" y="32" width="288" height="192"/>
    <rect class="mood-map-wall" x="16" y="32" width="32" height="192"/>
    <rect class="mood-map-wall" x="272" y="32" width="32" height="192"/>
    <rect x="16" y="32" width="288" height="192" fill="url(#mood-grid)"/>
    <rect class="mood-map-wall mood-map-center" x="80" y="64" width="96" height="64"/>
    <path class="mood-route mood-route-short" d="M160 144H192V48H174" marker-end="url(#mood-route-head)"/>
    <path class="mood-route mood-route-detour" d="M160 144H64V48H146" marker-end="url(#mood-route-head)"/>
    <circle class="mood-agent" cx="160" cy="144" r="10"/>
    <circle class="mood-pellet" cx="160" cy="48" r="8"/>
    <rect class="mood-ghost" x="216" y="104" width="16" height="16" rx="1"/>
    <path class="mood-ghost-mark" d="m221 109 6 6m0-6-6 6"/>
    <text class="mood-map-label" x="160" y="22" text-anchor="middle">Pellet</text>
    <text class="mood-map-label" x="160" y="174" text-anchor="middle">Agent</text>
    <text class="mood-map-label mood-hazard-label" x="238" y="98">Active ghost</text>
  </svg>
  <figcaption>
    <p class="mood-route-note" aria-live="polite">Seeking favors the eastern shortcut.</p>
    <p class="mood-figure-source">Route preferences from Figure 3, with the observation and actor held fixed. <a href="{{ '/assets/figures/mood-junction.svg' | relative_url }}" target="_blank" rel="noopener">Original figure</a></p>
  </figcaption>
</figure>
