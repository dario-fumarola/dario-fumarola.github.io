<figure class="memory-demo" data-phase="next" data-playback="static">
  <div class="memory-demo-heading"><h3>Same action, different memory</h3><span>Navigation sketch</span></div>
  <div class="memory-usecase">
    <div class="memory-steps" role="group" aria-label="Animation steps">
      <button type="button" data-step="propose" aria-pressed="false">Propose a route</button>
      <button type="button" data-step="correct" aria-pressed="false">Edit the state</button>
      <button type="button" data-step="next" aria-pressed="true">Next decision</button>
    </div>
    <p class="memory-step-explanation">At the next decision, the saved state produces a new route before another solve.</p>
    <div class="memory-route-panels">
      {% assign memory_branches = 'kept,discarded' | split: ',' %}{% for branch in memory_branches %}
      <div class="memory-route-panel memory-route-{{ branch }}">
        <h3>{% if branch == 'kept' %}Keep the corrected state{% else %}Restore the original state{% endif %}</h3>
        <svg class="memory-navigation" viewBox="0 0 300 180" role="img" aria-labelledby="memory-{{ branch }}-title memory-{{ branch }}-desc">
          <title id="memory-{{ branch }}-title">{% if branch == 'kept' %}Corrected memory gives the next route a useful starting point{% else %}Original memory proposes a blocked route again{% endif %}</title>
          <desc id="memory-{{ branch }}-desc">Both controllers first propose the same blocked route. A local solver edits their hidden state to improve the decoded route. Both execute the same corrected first move. {% if branch == 'kept' %}This branch saves the edited state for the next decision.{% else %}This branch restores the original state before the next decision.{% endif %} Dashed paths show proposals before another solve, not executed actions.</desc>
          <defs><mask id="memory-move-mask-{{ branch }}" maskUnits="userSpaceOnUse" x="0" y="0" width="300" height="180"><path class="memory-move-reveal" d="M28 100C36 100 65 110.67 76 100C87 89.33 81.67 46.67 96 36C110.33 25.33 138.33 36 156 36C173.67 36 190.67 25.33 202 36C213.33 46.67 211.67 89.33 224 100C236.33 110.67 267.33 100 276 100" fill="none" stroke="white" stroke-width="9" pathLength="1" stroke-dasharray="1" stroke-dashoffset=".75"/></mask></defs>
          <path class="memory-safe-reference" d="M28 100C36 100 65 110.67 76 100C87 89.33 81.67 46.67 96 36C110.33 25.33 138.33 36 156 36C173.67 36 190.67 25.33 202 36C213.33 46.67 211.67 89.33 224 100C236.33 110.67 267.33 100 276 100"/>
          <rect class="memory-obstacle" x="130" y="64" width="50" height="76" rx="2"/>
          <path class="memory-obstacle-lines" d="m130 82 18-18m-18 36 36-36m-36 54 50-50m-50 68 50-50m-36 54 36-36m-18 36 18-18"/>
          <text class="memory-world-label" x="155" y="166" text-anchor="middle">Obstacle</text>
          <path class="memory-current-proposal" d="{% if branch == 'kept' %}M91 58Q110 29 156 36T202 36Q212 98 276 100{% else %}M91 58L276 100{% endif %}"/>
          <path class="memory-executed-move" d="M28 100C36 100 65 110.67 76 100C87 89.33 81.67 46.67 96 36C110.33 25.33 138.33 36 156 36C173.67 36 190.67 25.33 202 36C213.33 46.67 211.67 89.33 224 100C236.33 110.67 267.33 100 276 100" mask="url(#memory-move-mask-{{ branch }})"/>
          <g class="memory-robot" transform="translate(91 58)"><circle r="6"/><path d="M-2 0h4M0-2v4"/></g>
          <g class="memory-target" transform="translate(276 100)"><circle r="8"/><circle r="2"/></g>
          <text class="memory-world-label" x="272" y="78" text-anchor="middle">Goal</text>
          <g class="memory-blocked-mark" transform="translate(150 78)"><circle r="10"/><path d="m-3-3 6 6m0-6-6 6"/></g>
        </svg>
        <div class="memory-state-feed" aria-hidden="true"><svg viewBox="0 0 16 18" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><path d="M8 16V2m-3 3 3-3 3 3"/></svg></div>
        <div class="memory-state" data-state="{% if branch == 'kept' %}corrected{% else %}original{% endif %}"><span>Controller memory</span><strong class="memory-state-name">{% if branch == 'kept' %}Corrected state{% else %}Original state{% endif %}</strong></div>
        <p class="memory-route-status">{% if branch == 'kept' %}Useful next proposal{% else %}Needs another repair{% endif %}</p>
      </div>
      {% endfor %}
    </div>
    <p class="memory-demo-key"><span><i class="memory-solid-key" aria-hidden="true"></i>Executed move</span><span><i class="memory-dashed-key" aria-hidden="true"></i>Proposed route</span></p>
  </div>
  <figcaption class="memory-demo-caption">Both branches execute the same repaired first move. Only the memory saved for the next decision differs.</figcaption>
  <div class="memory-demo-controls"><a class="figure-source" href="../assets/figures/memory-intervention.svg" target="_blank" rel="noopener">Paper's intervention diagram</a><button class="memory-motion-toggle" type="button" aria-pressed="false" hidden><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3v10M11 3v10"/></svg><span>Pause motion</span></button></div>
</figure>
