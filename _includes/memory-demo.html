<figure class="memory-demo" data-phase="next" data-playback="static">
  <div class="memory-demo-heading"><h3>Two ways to remember a detour</h3><span>Navigation</span></div>
  <div class="memory-usecase">
    <div class="memory-steps" role="group" aria-label="Animation steps" hidden>
      <button type="button" data-step="observe" aria-pressed="false">See the obstacle</button>
      <button type="button" data-step="correct" aria-pressed="false">Find a detour</button>
      <button type="button" data-step="next" aria-pressed="true">Next decision</button>
    </div>
    <p class="memory-step-explanation">Attention reads the saved sequence. The recurrent controller starts from the state it already corrected.</p>
    <p class="memory-demo-key"><span><i class="memory-solid-key" aria-hidden="true"></i>Executed move</span><span><i class="memory-dashed-key" aria-hidden="true"></i>Proposed route</span></p>
    <div class="memory-route-panels">
      {% assign memory_branches = 'attention,state' | split: ',' %}{% for branch in memory_branches %}
      <div class="memory-route-panel memory-route-{{ branch }}">
        <h3>{% if branch == 'attention' %}Attention over history{% else %}Corrected recurrent state{% endif %}</h3>
        <p class="memory-architecture">{% if branch == 'attention' %}Observations and plans as records{% else %}Carry the correction in one state{% endif %}</p>
        <svg class="memory-navigation" viewBox="0 0 300 180" role="img" aria-labelledby="memory-{{ branch }}-title memory-{{ branch }}-desc">
          <title id="memory-{{ branch }}-title">{% if branch == 'attention' %}An attention-based controller follows the detour{% else %}A recurrent controller follows the same detour{% endif %}</title>
          <desc id="memory-{{ branch }}-desc">A new obstacle blocks the straight route. Both illustrative controllers find a detour, take the same first move and continue toward the goal. {% if branch == 'attention' %}The attention illustration reads relevant records from a saved sequence.{% else %}The recurrent illustration carries a local correction forward in its fixed-size hidden state.{% endif %} This is a comparison of memory mechanisms, not measured task performance.</desc>
          <defs><mask id="memory-move-mask-{{ branch }}" maskUnits="userSpaceOnUse" x="0" y="0" width="300" height="180"><path class="memory-move-reveal" d="M28 100C36 100 65 111 76 100C87 89 82 47 96 36C110 25 138 36 156 36C174 36 191 25 202 36C213 47 212 89 224 100C236 111 267 100 276 100" fill="none" stroke="white" stroke-width="9" pathLength="1" stroke-dasharray="1" stroke-dashoffset=".75"/></mask></defs>
          <path class="memory-safe-reference" d="M28 100C36 100 65 111 76 100C87 89 82 47 96 36C110 25 138 36 156 36C174 36 191 25 202 36C213 47 212 89 224 100C236 111 267 100 276 100"/>
          <g class="memory-obstacle-group"><rect class="memory-obstacle" x="130" y="64" width="50" height="76" rx="2"/><path class="memory-obstacle-lines" d="m130 82 18-18m-18 36 36-36m-36 54 50-50m-50 68 50-50m-36 54 36-36m-18 36 18-18"/><text class="memory-world-label memory-obstacle-label" x="155" y="166" text-anchor="middle">Obstacle</text></g>
          <path class="memory-current-proposal" d="M91 58Q110 29 156 36T202 36Q212 98 276 100"/>
          <path class="memory-executed-move" d="M28 100C36 100 65 111 76 100C87 89 82 47 96 36C110 25 138 36 156 36C174 36 191 25 202 36C213 47 212 89 224 100C236 111 267 100 276 100" mask="url(#memory-move-mask-{{ branch }})"/>
          <g class="memory-robot" transform="translate(91 58)"><circle r="6"/><path d="M-2 0h4M0-2v4"/></g>
          <g class="memory-target" transform="translate(276 100)"><circle r="8"/><circle r="2"/></g><text class="memory-world-label" x="272" y="78" text-anchor="middle">Goal</text>
          <g class="memory-blocked-mark" transform="translate(155 100)" opacity="0"><circle r="10"/><path d="m-3-3 6 6m0-6-6 6"/></g>
        </svg>
        <div class="memory-readout">
          <p class="memory-store-label">{% if branch == 'attention' %}Saved sequence{% else %}Fixed-size state{% endif %}</p>
          <svg class="memory-storage" viewBox="0 0 300 112" aria-hidden="true">
            {% if branch == 'attention' %}
              <g class="memory-history-links">{% for i in (0..7) %}{% assign hx = i | times: 36 | plus: 24 %}<path data-record="{{ i }}" d="M{{ hx }} 38Q{{ hx }} 65 150 84"/>{% endfor %}</g>
              <g class="memory-history">{% for i in (0..7) %}{% assign hx = i | times: 36 | plus: 10 %}<g class="memory-record" data-record="{{ i }}" style="opacity:{% if i < 6 %}1{% else %}.18{% endif %}"><rect x="{{ hx }}" y="14" width="28" height="24" rx="2"/><path d="M{{ hx | plus: 7 }} 23h14m-14 6h9"/></g>{% endfor %}</g>
              <circle class="memory-read-node" cx="150" cy="84" r="9"/><path class="memory-read-arrow" d="M150 94v12m-4-4 4 4 4-4"/>
            {% else %}
              <rect class="memory-input-record" x="18" y="20" width="18" height="18" rx="2"/>
              <path class="memory-input-arrow" d="M43 29H96m-5-4 5 4-5 4"/>
              <rect class="memory-state-frame" x="104" y="8" width="92" height="46" rx="3"/>
              <g class="memory-state-cells">{% for i in (0..5) %}{% assign cx = i | modulo: 3 | times: 24 | plus: 116 %}{% assign cy = i | divided_by: 3 | times: 16 | plus: 18 %}<rect x="{{ cx }}" y="{{ cy }}" width="20" height="10" rx="1"/>{% endfor %}</g>
              <path class="memory-state-loop" d="M164 84H238V30H204m5-4-5 4 5 4"/>
              <path class="memory-state-output" d="M150 54V74"/><circle class="memory-read-node" cx="150" cy="84" r="9"/><path class="memory-read-arrow" d="M150 94v12m-4-4 4 4 4-4"/>
            {% endif %}
          </svg>
          <p class="memory-route-status">{% if branch == 'attention' %}Read relevant records again{% else %}Reuse the corrected state{% endif %}</p>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
  <figcaption class="memory-demo-caption">Conceptual comparison, not a measured attention baseline. The experiments below compare keeping and discarding state corrections.</figcaption>
  <div class="memory-demo-controls"><a class="figure-source" href="../assets/figures/memory-intervention.svg" target="_blank" rel="noopener">Paper's intervention diagram</a><button class="memory-motion-toggle" type="button" aria-pressed="false" hidden><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3v10M11 3v10"/></svg><span>Pause motion</span></button></div>
</figure>
