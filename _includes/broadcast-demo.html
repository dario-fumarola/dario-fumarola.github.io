<figure class="bg-demo" data-scenario="delivered" data-playback="static">
  <div class="bg-demo-heading"><h2>One waiting agent, two switching rules</h2><span>Exact counterexample</span></div>
  <div class="bg-demo-scene">
    <div class="bg-scenarios" role="group" aria-label="Report pattern"><button type="button" data-delivery="1" aria-pressed="true">Reports delivered</button><button type="button" data-delivery="0" aria-pressed="false">No reports arrive</button></div>
    <p class="bg-scene-intro">One waiting agent isolates the bug. In busy traffic, many senders can also leave the controller with inconclusive reports.</p>
    <div class="bg-junction-panels">
      {% assign bg_branches = 'original,deadline' | split: ',' %}{% for branch in bg_branches %}
      <div class="bg-junction-panel bg-{{ branch }}" data-green="{% if branch == 'original' %}horizontal{% else %}vertical{% endif %}">
        <h3>{% if branch == 'original' %}Original BG{% else %}With a deadline{% endif %}</h3>
        <svg class="bg-junction" viewBox="0 0 260 205" role="img" aria-labelledby="bg-{{ branch }}-title bg-{{ branch }}-desc">
          <title id="bg-{{ branch }}-title">{% if branch == 'original' %}Original switching rule{% else %}BG-D with an unconditional 24-step deadline{% endif %}</title>
          <desc id="bg-{{ branch }}-desc">One agent waits on the unserved axis and no traffic uses the served axis. Reports are attempted every six steps. {% if branch == 'original' %}With reliable delivery, a nonempty cache bypasses the 24-step fallback but one report cannot pass the evidence test. The switch occurs at step 48, and green returns at step 50. With complete loss, these times are 24 and 26.{% else %}The deadline forces a switch at step 24 for either report pattern. Green returns after two clearance steps, at step 26.{% endif %} Vehicle movement is schematic; switching and clearance times follow the paper's counterexample.</desc>
          <path class="bg-road" d="M0 72H102V10H158V72H260V128H158V195H102V128H0Z"/>
          <path class="bg-lane-lines" d="M0 100H102M158 100H260M130 10V72M130 128V195"/>
          <g class="bg-horizontal-gate"><path d="M96 79V120M164 79V120"/></g>
          <g class="bg-vertical-gate"><path d="M110 66H150M110 134H150"/></g>
          <g class="bg-traffic-light"><rect x="172" y="126" width="10" height="27" rx="2"/><circle class="bg-traffic-red" cx="177" cy="133" r="2.8"/><circle class="bg-traffic-green" cx="177" cy="146" r="2.8"/><path d="M177 153v12"/></g>
          <g class="bg-controller" transform="translate(130 100)"><circle r="10"/><path d="M-3-3v6M3-3v6"/></g>
          <path class="bg-report-route" d="M144 150Q171 114 138 103"/>
          <g class="bg-packet" transform="translate(144 150)"><rect x="-4" y="-3" width="8" height="6" rx=".5"/><path d="M0-2v4"/></g>
          <g class="bg-vehicle" transform="translate(144 {% if branch == 'original' %}150{% else %}46{% endif %})"><rect x="-7" y="-11" width="14" height="22" rx="1.5"/><path d="M-4-5h8M-4 6h8"/></g>
        </svg>
        <p class="bg-junction-status">{% if branch == 'original' %}Still holding the empty axis{% else %}Waiting agent has green{% endif %}</p>
        <dl class="bg-switch-times"><div><dt>Switch at</dt><dd><span class="bg-switch-at">{% if branch == 'original' %}48{% else %}24{% endif %}</span><small>steps</small></dd></div><div><dt>Green returns at</dt><dd><span class="bg-open-at">{% if branch == 'original' %}50{% else %}26{% endif %}</span><small>steps</small></dd></div></dl>
      </div>
      {% endfor %}
    </div>
    <div class="bg-clock"><span>Step <output class="bg-step" aria-live="off">32</output></span><div class="bg-time-track"><b class="bg-time-fill" style="width:59.26%"></b><i style="left:44.44%"><span>24</span></i><i style="left:88.89%"><span>48</span></i></div></div>
  </div>
  <figcaption class="bg-demo-caption">The deadline restores green while original BG keeps waiting for stronger evidence.</figcaption>
  <div class="bg-demo-controls"><span>Reporting interval: 6 steps. Clearance: 2 steps.</span><button class="bg-motion-toggle" type="button" aria-pressed="false" hidden><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3v10M11 3v10"/></svg><span>Pause motion</span></button></div>
</figure>
